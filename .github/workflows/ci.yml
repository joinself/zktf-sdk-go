name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Fetch native zktf-sdk archive
        run: |
          scripts/fetch-native.sh
          cat .env >> "$GITHUB_ENV"
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: joinself/actions-public/slack-notification@main
        with:
          type: snapshot
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_CI_PLATFORM }}
